<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'">
  <title>Buddy Admin</title>
  <link rel="stylesheet" href="../common/base.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
<main>
  <p id="load-error" class="note error" hidden></p>

  <!-- Both sections stay hidden until the settings have arrived (admin.js shows them): nothing works without those. -->
  <section id="free-card" class="section" hidden>
    <h2>Free AI</h2>
    <p class="lead">These switches apply to every Buddy app and every user, the next time they open Buddy.</p>
    <p id="no-keys" class="note error" hidden>No AI key is set on the server yet, so free mode can't be turned on.</p>
    <!-- Voice has no switch: the server's Groq key turns it on, for everyone signed in (admin.js says which). -->
    <p id="voice-status" aria-live="polite"></p>

    <div class="group">
      <div class="group-row">
        <div class="grow">
          <label for="enabled" class="row-title">Free mode</label>
          <p id="enabled-note" class="muted small">Everyone uses your AI key.</p>
        </div>
        <input id="enabled" class="switch" type="checkbox" role="switch" aria-describedby="enabled-note">
      </div>
      <div class="group-row">
        <span id="limit-label" class="row-title">Free requests</span>
        <div class="segmented" role="radiogroup" aria-labelledby="limit-label">
          <label><input type="radio" name="limitMode" value="unlimited"><span>Unlimited</span></label>
          <label><input type="radio" name="limitMode" value="daily"><span>Daily limit</span></label>
        </div>
      </div>
      <div id="daily-row" class="group-row indent">
        <label for="daily" class="row-title">Requests per user per day</label>
        <input id="daily" type="number" min="1" max="10000" step="1">
      </div>
      <div id="own-row" class="group-row indent">
        <div class="grow">
          <label for="own" class="row-title">Also let users add their own key</label>
          <p id="own-note" class="muted small">Used after their free requests run out.</p>
        </div>
        <input id="own" class="switch" type="checkbox" role="switch" aria-describedby="own-note">
      </div>
      <div class="group-row">
        <label for="provider" class="row-title">AI provider</label>
        <select id="provider"></select>
      </div>
      <div class="group-row">
        <div class="grow">
          <label for="model" class="row-title">Model</label>
          <p id="models-note" class="muted" aria-live="polite"></p>
        </div>
        <div class="row model-pick">
          <select id="model"></select>
          <button id="models-refresh" class="btn" type="button">Refresh</button>
        </div>
      </div>
    </div>
    <p id="models-warning" class="note error" aria-live="polite" hidden></p>

    <div class="row actions">
      <span id="save-status" class="muted" aria-live="polite"></span>
      <button id="save" class="btn primary" type="button">Save</button>
    </div>
  </section>

  <section id="users-card" class="section" hidden>
    <div class="row section-head">
      <h2>Users</h2>
      <p id="users-status" class="muted" aria-live="polite"></p>
      <span class="spacer"></span>
      <button id="users-refresh" class="btn" type="button">Refresh</button>
    </div>
    <div class="group users">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th class="num">Today</th><th>Last active</th><th></th></tr></thead>
        <tbody id="users"></tbody>
      </table>
      <p id="users-empty" class="muted" hidden>No users yet.</p>
    </div>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
