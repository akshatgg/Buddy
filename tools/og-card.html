<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buddy link preview</title>
<!-- Rendered to web/public/og.png (1200x630) by tools/make-site-images.sh --og. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mukta:wght@500;600&display=swap">
<style>
  :root { --cream: #FFF5E9; --ink: #2A1E17; --ink-2: #6B5848; --orange: #FFB54C; --orange-tint: #FFE6C2; --pink-tint: #FFE1EB; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--cream); color: var(--ink); font-family: "Mukta", system-ui, sans-serif; position: relative; }
  .glow { position: absolute; inset: 0; background: radial-gradient(42% 60% at 78% 50%, var(--orange-tint), transparent 70%), radial-gradient(30% 40% at 96% 92%, var(--pink-tint), transparent 70%); }
  .copy { position: absolute; left: 80px; top: 92px; width: 600px; display: grid; gap: 26px; }
  .brand { display: flex; align-items: center; gap: 14px; font: 800 38px/1 "Baloo 2", system-ui, sans-serif; }
  .brand img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { margin: 0; font: 800 80px/0.98 "Baloo 2", system-ui, sans-serif; letter-spacing: -.015em; }
  p { margin: 0; font-size: 30px; color: var(--ink-2); line-height: 1.3; }
  .pill { justify-self: start; background: var(--ink); color: var(--cream); font: 600 26px/1 "Mukta", sans-serif; padding: 16px 26px; border-radius: 999px; }
  .duo { position: absolute; right: 50px; bottom: 50px; display: flex; align-items: flex-end; }
  .duo img { width: 300px; filter: drop-shadow(0 18px 20px rgba(42, 30, 23, .22)); }
  .duo img + img { width: 250px; margin-left: -70px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="brand"><img src="../web/public/img/icon.webp" alt="">Buddy</div>
    <h1>Your English buddy, on every screen.</h1>
    <p>Ask in English, Hindi or Hinglish. Buddy writes it right, in any app.</p>
    <span class="pill">Free for Mac</span>
  </div>
  <div class="duo">
    <img src="../web/public/img/aarav.webp" alt="">
    <img src="../web/public/img/anaya.webp" alt="">
  </div>
</body>
</html>
