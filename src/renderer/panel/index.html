<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="../common/base.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="panel">
  <header>
    <div class="title"><strong id="who">Buddy</strong> <span id="where" class="muted"></span></div>
    <div class="tools">
      <button id="claude-mode" class="btn small mode" type="button" aria-pressed="false" title="Claude mode: your Claude Code sessions">Claude</button>
      <button id="size" class="icon glyph-size" type="button" title="Bigger" aria-label="Make the panel bigger">⤢</button>
      <button id="settings" class="icon glyph-gear" type="button" title="Settings" aria-label="Settings"></button>
      <button id="close" class="icon cross" type="button" title="Close (Esc)" aria-label="Close"></button>
    </div>
  </header>

  <div id="chat" class="chat" role="log" aria-label="Chat" aria-live="off">
    <div id="empty" class="empty">
      <p id="greeting" class="greeting">Hi! What should we do?</p>
      <p class="examples"><span>“boss ko mail, kal chutti chahiye”</span> · <span>“fix this”</span> · <span>“what does this mean?”</span> <span id="example-sep" hidden>·</span> <span id="example-code" hidden></span></p>
    </div>
    <ol id="items" class="items"></ol>
    <p id="thinking" class="thinking" aria-live="polite" hidden></p>
  </div>

  <div id="claude-view" class="claude" hidden>
    <div id="claude-pick" class="claude-pick">
      <p class="claude-ask">Which Claude Code session?</p>
      <ul id="claude-sessions" class="sessions"></ul>
      <p id="claude-none" class="muted small" hidden>No Claude Code session is running. Start <code>claude</code> in a terminal, then look again.</p>
      <p id="claude-pick-error" class="note error" hidden></p>
      <button id="claude-again" class="btn small" type="button">Look again</button>
    </div>
    <div id="claude-session" class="claude-session" hidden>
      <div class="claude-bar">
        <button id="claude-back" class="btn small quiet" type="button" aria-label="Back to the sessions">‹ Sessions</button>
        <strong id="claude-name" class="grow"></strong>
        <span id="claude-status" class="status-chip"></span>
      </div>
      <ol id="claude-items" class="claude-items" aria-label="The session"></ol>
    </div>
  </div>

  <div class="compose">
    <div id="notice" class="note fix" hidden>
      <p id="notice-text" class="grow"></p>
      <button id="notice-fix" class="btn small" type="button" hidden>Allow</button>
    </div>
    <div id="send-error" class="note error" aria-live="polite" hidden>
      <p id="send-error-text" class="grow"></p>
      <button id="send-error-settings" class="btn small" type="button" hidden>Open Settings</button>
    </div>
    <div id="selection" class="selection" hidden>
      <p class="grow"><span class="muted">Your selection:</span> <span id="selection-text"></span></p>
      <button id="drop-selection" class="icon cross" type="button" title="Leave it out" aria-label="Leave the selection out"></button>
    </div>
    <div id="box-frame" class="box">
      <textarea id="box" rows="1" placeholder="Tell me what to do…" aria-label="Tell me what to do"></textarea>
      <span id="voice-bars" class="bars" aria-hidden="true" hidden><i></i><i></i><i></i></span>
      <button id="mic" class="mic" type="button" title="Talk" aria-label="Talk" aria-pressed="false"></button>
      <button id="send" class="send" type="button" title="Send (↩)" aria-label="Send" disabled></button>
    </div>
  </div>
</div>
<div id="grip" class="grip right" title="Drag to resize" aria-hidden="true"></div>
<div id="announce" class="visually-hidden" aria-live="polite"></div>
<script src="chat-view.js"></script>
<script src="voice-timing.js"></script>
<script src="panel.js"></script>
</body>
</html>
