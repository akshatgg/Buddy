<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="notch.css">
</head>
<body data-mood="idle">
  <div id="shape" hidden>
    <div id="left" class="wing">
      <div id="eye-left" class="eye"><i class="ball"></i><i class="arch"></i><i class="curl"></i></div>
    </div>
    <div id="notch"></div>
    <div id="right" class="wing">
      <div id="eye-right" class="eye"><i class="ball"></i><i class="arch"></i><i class="curl"></i><i class="dot"></i></div>
      <span id="say" class="say-text" hidden></span>
    </div>
  </div>
  <span id="ruler" class="say-text" aria-hidden="true"></span>
  <script src="eyes.js"></script>
  <script src="notch.js"></script>
</body>
</html>
